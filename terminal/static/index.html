<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terminal</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <span id="brand-name" class="brand-name">Terminal</span>
      <a class="brand-credit" href="https://github.com/OpenBB-finance/OpenBB" target="_blank" rel="noopener" title="Data functions come from the open-source OpenBB Platform">built on the OpenBB Platform</a>
      <button id="btn-collapse" class="icon-btn" title="Collapse sidebar">«</button>
    </div>
    <div class="side-search"><input id="dash-filter" type="search" placeholder="Filter dashboards…" autocomplete="off"></div>
    <div id="dash-list" class="dash-list"></div>
    <div class="side-foot">
      <div id="backend-status"></div>
      <div id="save-status" class="muted small"></div>
    </div>
  </aside>
  <main id="main">
    <header id="topbar">
      <button id="btn-expand" class="icon-btn hidden" title="Show sidebar">»</button>
      <div id="dash-title" class="dash-title" title="Double-click to rename"></div>
      <div id="groups" class="groups"></div>
      <div class="spacer"></div>
      <input id="goto" type="search" placeholder="Ticker, company, data…  Ctrl+G" autocomplete="off" spellcheck="false" title="Type a ticker or a company name (AAPL, toyota, 7203.T, SHEL.L) to open it, or the name of a dashboard, tab or dataset (cpi, sofr, options) to jump there. Ctrl+G from anywhere.">
      <button id="btn-add" class="btn primary" title="Add a widget (Ctrl+K)">+ Widget</button>
      <button id="btn-refresh" class="btn" title="Reload every widget on this tab">Refresh</button>
      <button id="btn-more" class="btn" title="Dashboard actions">⋯</button>
      <button id="btn-help" class="btn" title="Quick guide: shortcuts, search, sources, exports, keys (?)">?</button>
    </header>
    <nav id="tabs" class="tabs"></nav>
    <div id="banner" class="banner hidden"></div>
    <section id="canvas-wrap"><div id="canvas"></div><div id="empty" class="empty hidden"></div></section>
  </main>
</div>
<div id="modal-root"></div>
<div id="pop-root"></div>
<script src="/vendor/plotly.min.js"></script>
<script src="/static/md.js"></script>
<script src="/static/table.js"></script>
<script src="/static/statements.js"></script>
<script src="/static/controls.js"></script>
<script src="/static/securities.js"></script>
<script src="/static/grid.js"></script>
<script src="/static/widgets.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
